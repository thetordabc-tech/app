<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tide</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="sky">
    <div id="sun" class="celestial"></div>
    <div id="moon" class="celestial"></div>
  </div>

  <div id="ocean">
    <div id="water">
      <div id="wave-wrap">
        <svg id="wave-svg" viewBox="0 0 1200 32" preserveAspectRatio="none">
          <path d="M0,17 C50,6 150,6 200,17 C250,28 350,28 400,17 C450,6 550,6 600,17 C650,28 750,28 800,17 C850,6 950,6 1000,17 C1050,28 1150,28 1200,17 L1200,32 L0,32 Z"></path>
        </svg>
      </div>

      <div id="tide-arrow-wrap">
        <span id="tide-arrow">&#8593;</span>
      </div>

      <div id="fish-1" class="fish">
        <svg viewBox="0 0 40 18">
          <path d="M10,9 C10,4 18,2 26,4 C32,5.5 36,7 38,9 C36,11 32,12.5 26,14 C18,16 10,14 10,9 Z" fill="#ff8a5c"></path>
          <path d="M10,9 L2,3 L2,15 Z" fill="#ff8a5c"></path>
          <circle cx="32" cy="7" r="1.3" fill="#062033"></circle>
        </svg>
      </div>
      <div id="fish-2" class="fish flip">
        <svg viewBox="0 0 40 18">
          <path d="M10,9 C10,4 18,2 26,4 C32,5.5 36,7 38,9 C36,11 32,12.5 26,14 C18,16 10,14 10,9 Z" fill="#ffb08a"></path>
          <path d="M10,9 L2,3 L2,15 Z" fill="#ffb08a"></path>
          <circle cx="32" cy="7" r="1.3" fill="#062033"></circle>
        </svg>
      </div>
      <div id="fish-3" class="fish">
        <svg viewBox="0 0 40 18">
          <path d="M10,9 C10,4 18,2 26,4 C32,5.5 36,7 38,9 C36,11 32,12.5 26,14 C18,16 10,14 10,9 Z" fill="#ff6f42"></path>
          <path d="M10,9 L2,3 L2,15 Z" fill="#ff6f42"></path>
          <circle cx="32" cy="7" r="1.3" fill="#062033"></circle>
        </svg>
      </div>

      <div id="rowboat">
        <svg viewBox="0 0 90 170">
          <path d="M78,4 L60,46 L60,155" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.85"></path>
          <circle cx="60" cy="155" r="3" fill="#ffcf4d"></circle>
          <line x1="52" y1="16" x2="78" y2="4" stroke="#5a3a1f" stroke-width="2" stroke-linecap="round"></line>
          <path d="M8,30 C8,26 20,25 45,25 C70,25 82,26 82,30 L74,42 C60,46 30,46 16,42 Z" fill="#9a6a3a"></path>
          <path d="M8,30 C8,26 20,25 45,25 C70,25 82,26 82,30" stroke="#6b431f" stroke-width="1.5" fill="none"></path>
          <path d="M40,10 Q45,6 50,10 L48,16 L42,16 Z" fill="#7a4a20"></path>
          <rect x="40" y="14" width="10" height="14" rx="4" fill="#2c3e50"></rect>
          <circle cx="45" cy="10" r="6" fill="#e0a978"></circle>
        </svg>
      </div>

      <div id="trawler">
        <svg viewBox="0 0 170 150">
          <line x1="70" y1="52" x2="15" y2="82" stroke="#3a3a42" stroke-width="1"></line>
          <line x1="95" y1="55" x2="75" y2="82" stroke="#3a3a42" stroke-width="1"></line>
          <path d="M15,82 L75,82 L58,140 Q45,148 32,140 Z" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.55)" stroke-width="1.2" stroke-dasharray="4 3"></path>
          <path d="M65,45 C65,38 85,35 115,35 C145,35 165,38 165,45 L158,55 C135,60 90,60 72,55 Z" fill="#4a4a52"></path>
          <path d="M65,45 C65,38 85,35 115,35 C145,35 165,38 165,45" stroke="#2b2b30" stroke-width="1.2" fill="none"></path>
          <rect x="120" y="15" width="30" height="22" rx="2" fill="#6b6b74"></rect>
          <rect x="126" y="20" width="7" height="7" fill="#dfefff"></rect>
          <rect x="137" y="20" width="7" height="7" fill="#dfefff"></rect>
          <line x1="135" y1="15" x2="135" y2="4" stroke="#2b2b30" stroke-width="2"></line>
        </svg>
      </div>
    </div>
  </div>

  <div id="hud-top">
    <div id="place" class="panel outlined">Locating…</div>
    <div id="clock" class="outlined">--:--</div>
  </div>

  <div id="side-info" class="outlined">
    <div class="side-row">
      <span class="side-label">Projected high</span>
      <span class="side-value" id="high-value">— m</span>
      <span class="side-eta" id="high-eta">—</span>
    </div>
    <div class="side-row side-row-current">
      <span class="side-label">Current</span>
      <span class="side-value" id="current-value">— m</span>
    </div>
    <div class="side-row">
      <span class="side-label">Projected low</span>
      <span class="side-value" id="low-value">— m</span>
      <span class="side-eta" id="low-eta">—</span>
    </div>
  </div>

  <div id="status"></div>

  <script src="app.js"></script>
</body>
</html>
