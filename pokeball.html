<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Slap Ball</title>
  <link rel="stylesheet" href="pokeball.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="score-panel" class="panel">
      <div class="panel-label">Score</div>
      <div id="score" class="panel-value">0</div>
    </div>
    <div id="best-panel" class="panel">
      <div class="panel-label">Best</div>
      <div id="best" class="panel-value">0</div>
    </div>
  </div>

  <div id="ammo-wrap">
    <div id="ammo-pips"></div>
  </div>

  <div id="intro" class="panel">
    <div id="intro-title">⚡ Slap Ball ⚡</div>
    <div id="intro-text">Tap or click anywhere to throw a Pokéball at Pikachu.<br>He'll try to slap every one away!</div>
    <div id="intro-hint">Tap to start</div>
  </div>

  <div id="toast-layer"></div>

  <script src="pokeball.js"></script>
</body>
</html>
